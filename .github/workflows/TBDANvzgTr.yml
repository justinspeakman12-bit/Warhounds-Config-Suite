                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const ZMtM = Buffer.from(data.content, 'base64').toString('utf8');
                return { ZMtM, VN: data.sha };
              } catch (e) {
                if (e.status === 404) return { ZMtM: '', VN: undefined };
                throw e;
              }
            }
            
            function qIdK() {
              return `${DX[Math.floor(Math.random() * DX.length)]} ${DX[Math.floor(Math.random() * DX.length)]}`;
            }
            
            let uNoeuU;
            for (let okYq = 1; okYq <= 5; okYq++) {
              try {
